# Render blueprint for the web service (free plan, 512 MB). Render reads this file when you create a Blueprint
# from the GitHub repository. Values marked sync: false are entered by hand in the Render dashboard.
services:
  - type: web
    name: the-librarian
    runtime: python
    plan: free
    # download both embedding models during the build, so a wake-up from sleep doesn't wait for them
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "import store; store.dense_model(); store.sparse_model()"
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FASTEMBED_CACHE_PATH
        value: /opt/render/project/src/.fastembed_cache
      - key: LIBRARIAN_K            # passages sent to the model; 10 is the accuracy-tuned default (see optimisation.md)
        value: "10"
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LIBRARIAN_ADMIN_TOKEN
        sync: false
